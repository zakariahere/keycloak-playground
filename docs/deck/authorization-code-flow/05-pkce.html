<div class="kicker"><b>04</b><span>PKCE</span></div>
<h1>Send the hash. <em>Keep the thing that made it.</em></h1>
<div class="hr"></div>

<div class="wrap">
<svg class="dg" viewBox="0 0 1150 240" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

  <rect class="sigbx" x="0" y="30" width="330" height="82" rx="3"/>
  <text class="tt sg" x="24" y="64">code_verifier</text>
  <text class="td" x="24" y="90">128 random chars. Never transmitted.</text>

  <line class="ln" x1="332" y1="71" x2="398" y2="71" marker-end="url(#a)"/>
  <rect class="bx" x="402" y="30" width="180" height="82" rx="3"/>
  <text class="tt" x="426" y="64">SHA-256</text>
  <text class="td" x="426" y="90">one-way</text>

  <line class="ln" x1="584" y1="71" x2="650" y2="71" marker-end="url(#a)"/>
  <rect class="bx" x="654" y="30" width="496" height="82" rx="3"/>
  <text class="tt" x="678" y="64">code_challenge</text>
  <text class="td" x="678" y="90">Goes in the URL, where anyone can read it.</text>

  <rect class="bx" x="0" y="140" width="1150" height="82" rx="3"/>
  <text class="tt" x="24" y="174">At redemption, the token request must present the verifier</text>
  <text class="td" x="24" y="200">Keycloak re-hashes it and compares. A stolen code alone redeems nothing.</text>
</svg>
</div>

<div class="verdict"><div class="bar"></div><div class="txt">PKCE binds the code to its requester <strong>with no shared secret</strong> &mdash; which is why it works for public clients that cannot hold one.</div></div>
