<div class="kicker"><b>05</b><span>Why there are two tokens, not one</span></div>
<h1>The one you use constantly <em>cannot be revoked</em></h1>
<div class="hr"></div>

<div class="wrap">
<svg class="dg" viewBox="0 0 1150 322" xmlns="http://www.w3.org/2000/svg">
  <rect class="bx" x="395" y="0" width="360" height="70" rx="3"/>
  <text class="tt" x="417" y="32">Your app</text>
  <text class="td" x="417" y="56">Holds both tokens</text>

  <path class="ln" d="M520 70 L300 106"/>
  <path class="ln" d="M630 70 L850 106"/>

  <rect class="sigbx" x="0" y="112" width="555" height="68" rx="3"/>
  <text class="tt sg" x="22" y="144">Access token &rarr; your API</text>
  <text class="td" x="22" y="168">On every single request</text>

  <rect class="bx" x="0" y="192" width="555" height="56" rx="3"/>
  <text class="tk" x="22" y="214">CHECKED HOW</text>
  <text class="td" x="22" y="236">Offline, against a cached public key</text>

  <rect class="bx" x="0" y="254" width="555" height="56" rx="3"/>
  <text class="tk" x="22" y="276">CAN IT BE REVOKED</text>
  <text class="td" x="22" y="298">No. Nobody ever phones home.</text>

  <rect class="bx" x="595" y="112" width="555" height="68" rx="3"/>
  <text class="tt" x="617" y="144">Refresh token &rarr; Keycloak</text>
  <text class="td" x="617" y="168">Only when the old one dies</text>

  <rect class="bx" x="595" y="192" width="555" height="56" rx="3"/>
  <text class="tk" x="617" y="214">CHECKED HOW</text>
  <text class="td" x="617" y="236">Live, against the database</text>

  <rect class="bx" x="595" y="254" width="555" height="56" rx="3"/>
  <text class="tk" x="617" y="276">CAN IT BE REVOKED</text>
  <text class="td" x="617" y="298">Yes, instantly</text>
</svg>
</div>

<div class="verdict"><div class="bar"></div><div class="txt">Expiry is not the security &mdash; it is the <strong>checkpoint schedule</strong>. Shortening token lifetime just means asking more often, and you pay in traffic.</div></div>
