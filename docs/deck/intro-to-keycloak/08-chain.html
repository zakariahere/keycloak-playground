<div class="kicker"><b>07</b><span>Where every auth failure comes from</span></div>
<h1>401 fires before identity exists. <em>403 fires after.</em></h1>
<div class="hr"></div>

<div class="wrap">
<svg class="dg" viewBox="0 0 1150 292" xmlns="http://www.w3.org/2000/svg">
  <rect class="bx" x="0" y="40" width="200" height="96" rx="3"/>
  <text class="tk" x="18" y="66">STAGE 01</text>
  <text class="tt" x="18" y="96">Bearer token</text>
  <text class="tt" x="18" y="118">present?</text>

  <rect class="bx" x="237" y="40" width="200" height="96" rx="3"/>
  <text class="tk" x="255" y="66">STAGE 02</text>
  <text class="tt" x="255" y="96">Signature, exp,</text>
  <text class="tt" x="255" y="118">iss, aud</text>

  <rect class="bx" x="474" y="40" width="200" height="96" rx="3"/>
  <text class="tk" x="492" y="66">STAGE 03</text>
  <text class="tt" x="492" y="96">Claims become</text>
  <text class="tt" x="492" y="118">authorities</text>

  <rect class="bx" x="711" y="40" width="200" height="96" rx="3"/>
  <text class="tk" x="729" y="66">STAGE 04</text>
  <text class="tt" x="729" y="96">Role check</text>
  <text class="tt" x="729" y="118">hasRole(...)</text>

  <rect class="bx" x="948" y="40" width="200" height="96" rx="3"/>
  <text class="tk" x="966" y="66">STAGE 05</text>
  <text class="tt" x="966" y="96">Controller</text>
  <text class="tt" x="966" y="118">runs &rarr; 200</text>

  <path class="ln" d="M200 88 L235 88"/>
  <path class="ln" d="M437 88 L472 88"/>
  <path class="ln" d="M674 88 L709 88"/>
  <path class="ln" d="M911 88 L946 88"/>

  <path class="ln" d="M100 136 L100 174"/>
  <path class="ln" d="M337 136 L337 174"/>
  <path class="ln" d="M811 136 L811 174"/>

  <rect class="ex" x="0" y="176" width="200" height="62" rx="3"/>
  <text class="code" x="18" y="206">401</text>
  <text class="tk" x="18" y="228">NO CREDENTIALS</text>

  <rect class="ex" x="237" y="176" width="200" height="62" rx="3"/>
  <text class="code" x="255" y="206">401</text>
  <text class="tk" x="255" y="228">INVALID_TOKEN</text>

  <rect class="ex" x="711" y="176" width="200" height="62" rx="3"/>
  <text class="code" x="729" y="206">403</text>
  <text class="tk" x="729" y="228">INSUFFICIENT_SCOPE</text>

  <line class="mk" x1="456" y1="20" x2="456" y2="252"/>
  <text class="sgk" x="456" y="278" text-anchor="middle">IDENTITY EXISTS FROM HERE ON</text>
</svg>
</div>

<div class="verdict"><div class="bar"></div><div class="txt">401 means &ldquo;I don&rsquo;t know you&rdquo;. 403 means &ldquo;I know you, and no&rdquo;. The <code>WWW-Authenticate</code> header <strong>names the exact stage</strong> that failed.</div></div>
